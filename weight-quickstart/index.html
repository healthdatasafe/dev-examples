<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weight quickstart · Health Data Safe</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; margin: 1rem 0; }
    input { flex: 1; padding: .4rem; }
    li { padding: .2rem 0; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>My weight</h1>

  <!-- hds-lib replaces this span with the sign-in / sign-out button. -->
  <span id="login-button">Loading…</span>

  <div id="app" hidden>
    <form id="weight-form">
      <input id="weight" type="number" step="0.1" min="1" placeholder="Weight in kg" required>
      <button type="submit">Save</button>
    </form>
    <h2>Stored weights</h2>
    <ul id="weights"></ul>
  </div>

  <p id="message" class="error"></p>

  <script type="module" src="/main.js"></script>
</body>
</html>
